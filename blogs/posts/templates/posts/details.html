
{% extends "base.html" %}

{% block title %}Detail Page{% endblock %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'posts/detail.css' %}">
{% endblock css %}
{% block content %}<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                {% if post.img %}
                <div class="bg-light text-center p-4">
                    <img src="{{ post.img }}"
                         class="img-fluid"
                         style="max-height: 300px; object-fit: contain;"
                         alt="{{ post.title }}">
                </div>
                {% endif %}

                <div class="card-body p-5">

                    <h2 class="card-title fw-bold mb-3">
                        {{ post.title }}
                    </h2>

                    <p class="text-muted small mb-2">
                        Course ID: {{ post.id }}
                    </p>

                    <hr>

                    <p class="card-text fs-5">
                        {{ post.desc }}
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'home' %}"
                           class="btn btn-outline-primary px-4">
                            ← Back to Courses
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
{% endblock %}
